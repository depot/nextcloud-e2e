name: Depot Nextcloud - e2e build

on:
  push:
    branches:
      - master
  schedule:
   # run it every 6 hours not to burn macOS capacity
    - cron: "10 */6 * * *"
  workflow_dispatch: {}

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          #- os: depot-macos-14
          #  destination: arch=arm64,platform=iOS Simulator,OS=18.6,name=iPhone 16
          #  xcode: /Applications/Xcode_16.4.app
          - os: depot-macos-15
            destination: arch=arm64,platform=iOS Simulator,OS=18.6,name=iPhone 16
            xcode: /Applications/Xcode_26.1.app
          - os: depot-macos-26
            destination: arch=arm64,platform=iOS Simulator,OS=26.4.1,name=iPhone 17
            xcode: /Applications/Xcode_26.5.app
    name: Build and Test
    runs-on: ${{ matrix.os }}
    env:
      PROJECT: Nextcloud.xcodeproj
      DESTINATION: ${{ matrix.destination }}
      XCODE: ${{ matrix.xcode }}
    steps:
    - uses: actions/checkout@v4
    - name: Download GoogleService-Info.plist
      run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist
    - name: test tcc hancks
      run: |
        sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR IGNORE INTO access VALUES('kTCCServiceDeveloperTool','com.apple.bash',0,0,4,1,NULL,NULL,0,'UNUSED',NULL,NULL,1756139927,NULL,NULL,'UNUSED',1756139927)"
        sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR IGNORE INTO access VALUES('kTCCServiceDeveloperTool','com.apple.zsh',0,0,4,1,NULL,NULL,0,'UNUSED',NULL,NULL,1756139927,NULL,NULL,'UNUSED',1756139927)"
        sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR IGNORE INTO access VALUES('kTCCServiceDeveloperTool','$(realpath /Users/runner/runner)/bin/Runner.Listener',1,0,4,1,NULL,NULL,0,'UNUSED',NULL, NULL,1756139927,NULL,NULL,'UNUSED',1756139927)"
    - name: xcode select
      run: sudo xcode-select -s "$XCODE"
    - name: Set env var
      run: echo "DEVELOPER_DIR=$(xcode-select --print-path)" >> $GITHUB_ENV
    - name: Build iOS Share
      run: |
        xcodebuild build -project $PROJECT -scheme "$SCHEME" -destination "$DESTINATION" | xcbeautify 
      env:
          SCHEME: Share
